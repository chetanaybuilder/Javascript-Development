<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Business Profit Calculator</title>

    <!-- Link to the external stylesheet for layout and visual styling -->

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Main calculator container: holds inputs, button, and result display -->

    <div class="calculator">

        <h1>Business Profit Calculator</h1>

        <p class="subtitle">
            Calculate your business profit
        </p>

        <!-- Revenue input field with accessible label -->

        <div class="input-group">
            <label for="revenue">Revenue (₹)</label>
            <input 
                type="number" 
                id="revenue" 
                placeholder="Enter revenue"
            >
        </div>

        <!-- Cost input field with accessible label -->

        <div class="input-group">
            <label for="cost">Cost (₹)</label>
            <input 
                type="number" 
                id="cost" 
                placeholder="Enter cost"
            >
        </div>

        <!-- Button triggers the profit calculation in script.js -->

        <button id="calculate">
            Calculate Profit
        </button>

        <!-- Result panel displays the calculated profit value -->

        <div class="result">
            <h2>Your Profit</h2>

            <p id="profit">₹0</p>
        </div>

    </div>

    <!-- Attach the application logic after the DOM content -->
     
    <script src="script.js"></script>

</body>
</html>
