<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Project: Day-06 Rock Paper Scissors
         Short: Lightweight browser game demonstrating DOM interaction
         and simple game logic. UI: three choice buttons, status, result. -->

    <title>Rock Paper Scissors</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <h1>Rock Paper Scissors</h1>

        <!-- Controls: player selects one of three moves -->
        <p>Choose your move:</p>

        <div class="buttons">
            <button id="rock">🪨 Rock</button>
            <button id="paper">📄 Paper</button>
            <button id="scissors">✂️ Scissors</button>
        </div>

        <!-- Status: shows selections; Result: shows winner text -->
        <p id="status"></p>

        <h2 id="result"></h2>

    </div>

    <script src="script.js"></script>

</body>
</html>
